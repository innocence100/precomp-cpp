name: Build Precomp Neo

on:
  workflow_dispatch:

jobs:
  # =================================================================
  # Linux 构建 (使用 Manylinux 容器以确保 glibc 兼容性)
  # =================================================================
  build_linux:
    name: Linux (Manylinux 2.28)
    runs-on: ubuntu-latest
    # 使用官方 manylinux 镜像，确保编译出的 .so 能在旧系统运行
    container: quay.io/pypa/manylinux_2_28_x86_64
    
    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies and Build
      run: |
        # 1. 设置 Python 环境 (使用容器内置的 Python 3.10)
        export PY_ROOT=/opt/python/cp310-cp310
        export PATH=$PY_ROOT/bin:$PATH
        
        echo "Using Python at: $(which python)"
        python --version
        
        # 2. 安装构建工具
        pip install cmake pybind11 ninja

        # 3. 配置 CMake
        # 注意：这里使用了我们在对话中验证过的关键参数
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DPYBIND11_FINDPYTHON=ON \
          -DPython_EXECUTABLE=$PY_ROOT/bin/python \
          -DPython_ROOT_DIR=$PY_ROOT \
          -DPython_FIND_STRATEGY=LOCATION \
          -GNinja

        # 4. 编译
        cmake --build . --config Release --parallel $(nproc)

    - name: Verify Output
      run: |
        ls -l build/
        # 简单检查 .so 是否生成
        if ls build/*.so 1> /dev/null 2>&1; then
          echo "Python extension (.so) found!"
        else
          echo "Error: Python extension not found!"
          exit 1
        fi
    
    - name: rename
      run: |
        cd build;
        ls | grep precomp_py*.so | xargs -I orig mv orig precomp_py.so

    - name: Archive Release
      uses: thedoctor0/zip-release@0.7.5
      with:
        type: 'zip'
        filename: 'precomp-linux-x86_64.zip'
        directory: build/

    - name: Upload Artifacts (Linux)
      uses: actions/upload-artifact@v4
      with:
        name: precomp-linux-x86_64
        path: build/precomp-linux-x86_64.zip

  upload_artifacts:
    name: upload
    needs: [build_linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
      - name: Display structure of downloaded files
        run: ls -R
      
      - name: upload and release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            precomp-linux-x86_64.zip
            precomp-windows-x64.zip
            precomp-macos.zip
          tag_name: v1.919.810
          body: precomp python binding
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
